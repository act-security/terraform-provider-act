name: Feature request
description: A resource, data source or attribute the provider should support.
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed resource or attribute
      render: hcl
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: references
    attributes:
      label: References
