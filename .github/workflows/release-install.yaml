name: Release install

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions: {}

jobs:
  install:
    name: Install (${{ matrix.os }}, ${{ matrix.tool }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        tool:
          - terraform@1.5.7
          - terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          experimental: true

      - name: Install the released provider from its registry
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TOOL: ${{ matrix.tool }}
          KEY_ID: ${{ vars.ACT_PROVIDER_GPG_KEY_ID }}
        run: scripts/release-install.sh
