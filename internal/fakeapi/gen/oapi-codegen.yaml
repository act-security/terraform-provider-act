package: gen
output: internal/fakeapi/gen/gen.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
compatibility:
  always-prefix-enum-values: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  type-mapping:
    string:
      formats:
        uuid:
          type: string
